[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slack-lists"
version = "0.1.0"
description = "CLI tool for managing a Slack Lists Kanban board / project tracker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "rich>=15.0.0",
    "slack-sdk>=3.48.0",
    "typer>=0.29.2",
]

[project.scripts]
slist = "slack_lists.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/slack_lists"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
